experiment:
  name: "symbolic_latent_demo"
  output_root: "outputs"
  models:
    - "aria_embedding"
    - "phrase_vae"

models:
  aria_embedding:
    type: "aria_embedding"
    repo_id: "loubb/aria-medium-embedding"
    checkpoint_filename: "model.safetensors"
    model_config_name: "medium-emb"
    device: "cpu"
  phrase_vae:
    type: "phrase_vae"
    # Use either repo_id (HF) or lightning_ckpt_path.
    repo_id: "LongshenOu/phrase-vae"
    device: "cpu"

queries:
  - id: "twinkle_abc"
    abc: |
      X:1
      T:Twinkle Twinkle
      M:4/4
      L:1/4
      K:C
      C C G G | A A G2 |
      F F E E | D D C2 |
  - id: "example_midi"
    midi_path: "data/example.mid"
  - id: "custom_example"
    custom: "C-E-G"
