experiment:
  name: Test
  output_root: ../outputs
  models:
  - aria_embedding
  - phrase_vae
models:
  aria_embedding:
    type: aria_embedding
    repo_id: loubb/aria-medium-embedding
    checkpoint_filename: model.safetensors
    model_config_name: medium-emb
    device: cpu
  phrase_vae:
    type: phrase_vae
    repo_id: LongshenOu/phrase-vae
    device: cpu
    trim: 16
queries:
- id: c
  name: C
  custom: C3
- id: cs
  name: C#
  custom: C#3
- id: d
  name: D
  custom: D3
- id: ds
  name: D#
  custom: D#3
- id: e
  name: E
  custom: E3
- id: f
  name: F
  custom: F3
- id: fs
  name: F#
  custom: F#3
- id: g
  name: G
  custom: G3
- id: gs
  name: G#
  custom: G#3
- id: a
  name: A
  custom: A3
- id: as
  name: A#
  custom: A#3
- id: b
  name: B
  custom: B3
axes:
- name: C_vs_Gb
  query_a: c
  query_b: fs
  method: explicit
- name: A_vs_Eb
  query_a: a
  query_b: ds
  method: explicit
plots:
  note_circle_axes:
    axes: &id001
    - C_vs_Gb
    - A_vs_Eb
    options:
      orthonormalize: false
      pca: false
  note_circle_axes_orthonormal:
    axes: *id001
    options:
      orthonormalize: true
      pca: false
      origin_strategy: mean
  note_circle_axes_pca:
    axes: *id001
    options:
      orthonormalize: false
      pca: true
  note_circle_axes_orthonormal_pca:
    axes: *id001
    options:
      orthonormalize: true
      pca: true
      origin_strategy: mean
  note_circle_cosine:
    cosine: &id002
    - c
    - a
    options:
      orthonormalize: false
      pca: false
  note_circle_cosine_pca:
    cosine: *id002
    options:
      orthonormalize: false
      pca: true
  note_circle_mds:
    mds: true
    options: {}
