  query_b: ds
  method: explicit
plots:
  note_circle_axes:
    axes: &id001
    - C_vs_Gb
    - A_vs_Eb
    options:
      lda_groups: true
      averaged_only: true
      orthonormalize: false
      pca: false
  note_circle_axes_orthonormal:
    axes: *id001
    options:
      lda_groups: true
      averaged_only: true
      orthonormalize: true
      pca: false
      origin_strategy: mean
  note_circle_axes_pca:
