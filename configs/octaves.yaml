experiment:
  name: "Test"
  output_root: "../outputs"
  models:
    - "aria_embedding"
    - "phrase_vae"

models:
  aria_embedding:
    type: "aria_embedding"
    repo_id: "loubb/aria-medium-embedding"
    checkpoint_filename: "model.safetensors"
    model_config_name: "medium-emb"
    device: "cpu"
  phrase_vae:
    type: "phrase_vae"
    repo_id: "LongshenOu/phrase-vae"
    device: "cpu"
    trim: 16

queries:
  - id: "c"
    name: "C"
    custom: "C1-C2-C3-C4-C5"
  - id: "cs"
    name: "C#"
    custom: "C#1-C#2-C#3-C#4-C#5"
  - id: "d"
    name: "D"
    custom: "D1-D2-D3-D4-D5"
  - id: "ds"
    name: "D#"
    custom: "D#1-D#2-D#3-D#4-D#5"
  - id: "e"
    name: "E"
    custom: "E1-E2-E3-E4-E5"
  - id: "f"
    name: "F"
    custom: "F1-F2-F3-F4-F5"
  - id: "fs"
    name: "F#"
    custom: "F#1-F#2-F#3-F#4-F#5"
  - id: "g"
    name: "G"
    custom: "G1-G2-G3-G4-G5"
  - id: "gs"
    name: "G#"
    custom: "G#1-G#2-G#3-G#4-G#5"
  - id: "a"
    name: "A"
    custom: "A1-A2-A3-A4-A5"
  - id: "as"
    name: "A#"
    custom: "A#1-A#2-A#3-A#4-A#5"
  - id: "b"
    name: "B"
    custom: "B1-B2-B3-B4-B5"

axes:
  - name: "C_vs_Gb"
    query_a: "c"
    query_b: "fs"
    method: "explicit"
  - name: "A_vs_Eb"
    query_a: "a"
    query_b: "ds"
    method: "explicit"

plots:
  note_circle:
    axes:
      - "C_vs_Gb"
      - "A_vs_Eb"
    options:
      orthonormalize: false
      pca: false
      cosine_references: ["c", "a"]
  note_circle_orthonormal:
    axes:
      - "C_vs_Gb"
      - "A_vs_Eb"
    options:
      orthonormalize: true
      origin_strategy: "mean"
      pca: false
      cosine_references: ["c", "a"]
  note_circle_pca:
    axes:
      - "C_vs_Gb"
      - "A_vs_Eb"
    options:
      orthonormalize: false
      pca: true
      cosine_references: ["c", "a"]
  note_circle_orthonormal_pca:
    axes:
      - "C_vs_Gb"
      - "A_vs_Eb"
    options:
      orthonormalize: true
      origin_strategy: "mean"
      pca: true
      cosine_references: ["c", "a"]
