experiment:
  name: Test
  output_root: ../outputs
  models:
  - aria_embedding
  - phrase_vae
models:
  aria_embedding:
    type: aria_embedding
    repo_id: loubb/aria-medium-embedding
    checkpoint_filename: model.safetensors
    model_config_name: medium-emb
    device: cpu
  phrase_vae:
    type: phrase_vae
    repo_id: LongshenOu/phrase-vae
    device: cpu
    trim: 16
queries:
- id: c
  name: C
  custom: C6 C1 C1 C6 C3 C2 C2 C2 C6 C1 C6 C6 C5 C1 C5 C4 C1 C1 C1 C2
- id: cs
  name: C#
  custom: C#2 C#5 C#5 C#1 C#5 C#2 C#6 C#6 C#6 C#5 C#4 C#2 C#4 C#5 C#3 C#1 C#2 C#6
    C#4 C#3
- id: d
  name: D
  custom: D3 D2 D2 D3 D1 D1 D4 D1 D3 D3 D5 D3 D1 D6 D4 D5 D1 D4 D1 D5
- id: ds
  name: D#
  custom: D#3 D#6 D#5 D#3 D#5 D#2 D#6 D#1 D#1 D#6 D#2 D#3 D#1 D#2 D#1 D#4 D#3 D#4
    D#6 D#3
- id: e
  name: E
  custom: E2 E3 E3 E2 E6 E3 E6 E6 E6 E1 E5 E6 E2 E5 E6 E2 E2 E4 E4 E3
- id: f
  name: F
  custom: F6 F6 F5 F2 F6 F3 F1 F2 F1 F3 F4 F3 F1 F2 F5 F6 F3 F2 F6 F4
- id: fs
  name: F#
  custom: F#4 F#6 F#4 F#2 F#3 F#2 F#2 F#6 F#5 F#5 F#3 F#6 F#5 F#4 F#5 F#4 F#3 F#2
    F#2 F#5
- id: g
  name: G
  custom: G4 G1 G1 G1 G2 G6 G2 G6 G4 G5 G1 G4 G4 G5 G4 G5 G3 G5 G1 G6
- id: gs
  name: G#
  custom: G#6 G#1 G#6 G#5 G#3 G#6 G#3 G#1 G#3 G#4 G#2 G#4 G#1 G#6 G#6 G#3 G#5 G#2
    G#5 G#1
- id: a
  name: A
  custom: A6 A3 A6 A5 A5 A2 A2 A3 A2 A5 A5 A1 A5 A3 A4 A1 A1 A3 A3 A2
- id: as
  name: A#
  custom: A#1 A#2 A#5 A#1 A#1 A#6 A#4 A#1 A#5 A#2 A#2 A#6 A#4 A#5 A#2 A#3 A#5 A#5
    A#4 A#2
- id: b
  name: B
  custom: B5 B6 B6 B2 B6 B3 B4 B6 B6 B3 B4 B5 B4 B1 B2 B2 B1 B3 B1 B5
axes:
- name: C_vs_Gb
  query_a: c
  query_b: fs
  method: explicit
- name: A_vs_Eb
  query_a: a
  query_b: ds
  method: explicit
plots:
  note_circle_axes:
    axes: &id001
    - C_vs_Gb
    - A_vs_Eb
    options:
      orthonormalize: false
      pca: false
  note_circle_axes_orthonormal:
    axes: *id001
    options:
      orthonormalize: true
      pca: false
      origin_strategy: mean
  note_circle_axes_pca:
    axes: *id001
    options:
      orthonormalize: false
      pca: true
  note_circle_axes_orthonormal_pca:
    axes: *id001
    options:
      orthonormalize: true
      pca: true
      origin_strategy: mean
  note_circle_cosine:
    cosine: &id002
    - c
    - a
    options:
      orthonormalize: false
      pca: false
  note_circle_cosine_pca:
    cosine: *id002
    options:
      orthonormalize: false
      pca: true
  note_circle_mds:
    mds: true
    options: {}
