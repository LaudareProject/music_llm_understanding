experiment:
  name: "Test"
  output_root: "../outputs"
  models:
    - "aria_embedding"
    - "phrase_vae"

models:
  aria_embedding:
    type: "aria_embedding"
    repo_id: "loubb/aria-medium-embedding"
    checkpoint_filename: "model.safetensors"
    model_config_name: "medium-emb"
    device: "cpu"
  phrase_vae:
    type: "phrase_vae"
    repo_id: "LongshenOu/phrase-vae"
    device: "cpu"
    trim: 16

queries:
  - color: "red"
    queries:
      - id: "triad_c_major"
        name: "C maj"
        custom: "C3-E3-G3"
      - id: "triad_cs_major"
        name: "C# maj"
        custom: "C#3-F3-G#3"
      - id: "triad_d_major"
        name: "D maj"
        custom: "D3-F#3-A3"
      - id: "triad_ds_major"
        name: "D# maj"
        custom: "D#3-G3-A#3"
      - id: "triad_e_major"
        name: "E maj"
        custom: "E3-G#3-B3"
      - id: "triad_f_major"
        name: "F maj"
        custom: "F3-A3-C4"
      - id: "triad_fs_major"
        name: "F# maj"
        custom: "F#3-A#3-C#4"
      - id: "triad_g_major"
        name: "G maj"
        custom: "G3-B3-D4"
      - id: "triad_gs_major"
        name: "G# maj"
        custom: "G#3-C4-D#4"
      - id: "triad_a_major"
        name: "A maj"
        custom: "A3-C#4-E4"
      - id: "triad_as_major"
        name: "A# maj"
        custom: "A#3-D4-F4"
      - id: "triad_b_major"
        name: "B maj"
        custom: "B3-D#4-F#4"

  - color: "blue"
    queries:
      - id: "triad_c_minor"
        name: "C min"
        custom: "C3-Eb3-G3"
      - id: "triad_cs_minor"
        name: "C# min"
        custom: "C#3-E3-G#3"
      - id: "triad_d_minor"
        name: "D min"
        custom: "D3-F3-A3"
      - id: "triad_ds_minor"
        name: "D# min"
        custom: "D#3-F#3-A#3"
      - id: "triad_e_minor"
        name: "E min"
        custom: "E3-G3-B3"
      - id: "triad_f_minor"
        name: "F min"
        custom: "F3-Ab3-C4"
      - id: "triad_fs_minor"
        name: "F# min"
        custom: "F#3-A3-C#4"
      - id: "triad_g_minor"
        name: "G min"
        custom: "G3-Bb3-D4"
      - id: "triad_gs_minor"
        name: "G# min"
        custom: "G#3-B3-D#4"
      - id: "triad_a_minor"
        name: "A min"
        custom: "A3-C4-E4"
      - id: "triad_as_minor"
        name: "A# min"
        custom: "A#3-C#4-F4"
      - id: "triad_b_minor"
        name: "B min"
        custom: "B3-D4-F#4"

  - color: "green"
    queries:
      - id: "triad_c_diminished"
        name: "C dim"
        custom: "C3-Eb3-Gb3"
      - id: "triad_cs_diminished"
        name: "C# dim"
        custom: "C#3-E3-G3"
      - id: "triad_d_diminished"
        name: "D dim"
        custom: "D3-F3-Ab3"
      - id: "triad_ds_diminished"
        name: "D# dim"
        custom: "D#3-F#3-A3"
      - id: "triad_e_diminished"
        name: "E dim"
        custom: "E3-G3-Bb3"
      - id: "triad_f_diminished"
        name: "F dim"
        custom: "F3-Ab3-B3"
      - id: "triad_fs_diminished"
        name: "F# dim"
        custom: "F#3-A3-C4"
      - id: "triad_g_diminished"
        name: "G dim"
        custom: "G3-Bb3-Db4"
      - id: "triad_gs_diminished"
        name: "G# dim"
        custom: "G#3-B3-D4"
      - id: "triad_a_diminished"
        name: "A dim"
        custom: "A3-C4-Eb4"
      - id: "triad_as_diminished"
        name: "A# dim"
        custom: "A#3-C#4-E4"
      - id: "triad_b_diminished"
        name: "B dim"
        custom: "B3-D4-F4"

  - color: "orange"
    queries:
      - id: "triad_c_augmented"
        name: "C aug"
        custom: "C3-E3-G#3"
      - id: "triad_cs_augmented"
        name: "C# aug"
        custom: "C#3-F3-A3"
      - id: "triad_d_augmented"
        name: "D aug"
        custom: "D3-F#3-A#3"
      - id: "triad_ds_augmented"
        name: "D# aug"
        custom: "D#3-G3-B3"
      - id: "triad_e_augmented"
        name: "E aug"
        custom: "E3-G#3-C4"
      - id: "triad_f_augmented"
        name: "F aug"
        custom: "F3-A3-C#4"
      - id: "triad_fs_augmented"
        name: "F# aug"
        custom: "F#3-A#3-D4"
      - id: "triad_g_augmented"
        name: "G aug"
        custom: "G3-B3-D#4"
      - id: "triad_gs_augmented"
        name: "G# aug"
        custom: "G#3-C4-E4"
      - id: "triad_a_augmented"
        name: "A aug"
        custom: "A3-C#4-F4"
      - id: "triad_as_augmented"
        name: "A# aug"
        custom: "A#3-D4-F#4"
      - id: "triad_b_augmented"
        name: "B aug"
        custom: "B3-D#4-G4"

axes:
  - name: "Cmaj_vs_Gbmaj"
    query_a: "triad_c_major"
    query_b: "triad_fs_major"
    method: "explicit"
  - name: "Amaj_vs_Ebmaj"
    query_a: "triad_a_major"
    query_b: "triad_ds_major"
    method: "explicit"
  - name: "Cmin_vs_Gbmin"
    query_a: "triad_c_minor"
    query_b: "triad_fs_minor"
    method: "explicit"
  - name: "Amin_vs_Ebmin"
    query_a: "triad_a_minor"
    query_b: "triad_ds_minor"
    method: "explicit"

plots:
  tritone_grid_t0_o0_n0:
    axes:
      - "Cmaj_vs_Gbmaj"
      - "Amaj_vs_Ebmaj"
    options:
      orthonormalize: false
      pca: false
      cosine_references: ["triad_c_major", "triad_a_major"]
  tritone_grid_t0_o0_n1:
    axes:
      - "Cmaj_vs_Gbmaj"
      - "Amaj_vs_Ebmaj"
    options:
      orthonormalize: true
      normalize_vectors: true
      origin_strategy: "mean"
      pca: false
      cosine_references: ["triad_c_major", "triad_a_major"]
  tritone_grid_t0_o0_n0_pca:
    axes:
      - "Cmaj_vs_Gbmaj"
      - "Amaj_vs_Ebmaj"
    options:
      orthonormalize: false
      pca: true
      cosine_references: ["triad_c_major", "triad_a_major"]
  tritone_grid_t0_o0_n0_orthonormal_pca:
    axes:
      - "Cmaj_vs_Gbmaj"
      - "Amaj_vs_Ebmaj"
    options:
      orthonormalize: true
      origin_strategy: "mean"
      pca: true
      cosine_references: ["triad_c_major", "triad_a_major"]
  tritone_grid_t0_o0_n1_pca:
    axes:
      - "Cmaj_vs_Gbmaj"
      - "Amaj_vs_Ebmaj"
    options:
      orthonormalize: true
      normalize_vectors: true
      origin_strategy: "mean"
      pca: true
      cosine_references: ["triad_c_major", "triad_a_major"]
